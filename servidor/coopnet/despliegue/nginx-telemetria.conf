# Opcional: publicar el resumen de telemetría por HTTP (por ejemplo para una página o un bot).
# Copiar dentro del bloque server { } de un sitio de nginx y recargar (nginx -t && systemctl reload nginx).
location = /telemetria.json {
    alias /var/lib/coopnet/telemetria.json;
    default_type application/json;
    add_header Cache-Control "no-store";
    add_header Access-Control-Allow-Origin "*";
}
location = /telemetria.csv {
    alias /var/lib/coopnet/telemetria.csv;
    default_type text/csv;
}
